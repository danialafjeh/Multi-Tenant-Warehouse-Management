services:
  db:
    image: postgres:18

    environment:
      POSTGRES_DB:  stockroom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DemoPass

    volumes:
      - postgres_data:/var/lib/postgresql
      
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d stockroom_db"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  django:
    build: .
    ports:
      - "8000:8000"
    
    environment:
      SECRET_KEY: DemoOnlyKey
      POSTGRES_DB:  stockroom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: DemoPass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432

    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
